<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SceneMux logo</title>
  <desc id="desc">A scene frame divided into five aligned semantic slots: editor, terminal, preview, observability, and communication.</desc>

  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101822"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>

    <linearGradient id="editorSlot" x1="120" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>

    <linearGradient id="terminalSlot" x1="120" y1="292" x2="280" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>

    <linearGradient id="previewSlot" x1="292" y1="120" x2="392" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="observabilitySlot" x1="292" y1="232" x2="392" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="communicationSlot" x1="292" y1="316" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" rx="112" fill="url(#backdrop)"/>

    <!-- The scene: one frame that owns every slot inside it. -->
    <rect x="88" y="88" width="336" height="336" rx="44" stroke="#1F2C3A" stroke-width="4"/>

    <!-- Semantic slots, aligned on a shared grid rather than floating freely. -->
    <g>
      <rect x="120" y="120" width="160" height="160" rx="18" fill="url(#editorSlot)"/>
      <rect x="120" y="292" width="160" height="100" rx="18" fill="url(#terminalSlot)"/>
      <rect x="292" y="120" width="100" height="100" rx="18" fill="url(#previewSlot)"/>
      <rect x="292" y="232" width="100" height="72" rx="18" fill="url(#observabilitySlot)"/>
      <rect x="292" y="316" width="100" height="76" rx="18" fill="url(#communicationSlot)"/>
    </g>
  </g>
</svg>
