name: Update Homebrew cask

# Manual only. SceneMux does not publish a Homebrew cask yet, and this must never
# fire automatically when a SceneMux release is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicitly configured tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "No HOMEBREW_TAP_TOKEN is configured; SceneMux publishes no Homebrew cask." >&2
            exit 1
          fi

      - name: Check out the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Chisanan232/homebrew
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew

      - name: Update the SceneMux cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          asset="SceneMux-${version}.zip"

          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          sha256="$(sha256sum "release/$asset" | awk '{print $1}')"

          cat > homebrew/Casks/scenemux.rb <<EOF
          cask "scenemux" do
            version "$version"
            sha256 "$sha256"

            url "https://github.com/Chisanan232/SceneMux/releases/download/v#{version}/SceneMux-#{version}.zip"
            name "SceneMux"
            desc "Task-oriented desktop application multiplexer for macOS"
            homepage "https://github.com/Chisanan232/SceneMux"

            depends_on macos: :ventura

            app "SceneMux.app"

            zap trash: [
              "~/.config/scenemux",
              "~/.scenemux.toml",
              "~/Library/LaunchAgents/com.chisanan232.scenemux.plist",
            ]
          end
          EOF

          git -C homebrew diff --check
          git -C homebrew add Casks/scenemux.rb
          if git -C homebrew diff --cached --quiet; then
            exit 0
          fi

          git -C homebrew config user.name "github-actions[bot]"
          git -C homebrew config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew commit -m "scenemux ${version}"
          git -C homebrew push
