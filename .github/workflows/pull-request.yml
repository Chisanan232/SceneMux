name: pull-request

# Every change reaches main through a pull request (docs/development/workflow.md), so this is the
# gate that has to be green before a merge commit is created.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Provenance, licensing and update-feed guards. They are pure-stdlib Python and read only
  # repository files, so they run on the cheapest runner and report in seconds — a broken
  # legal record or a leaked Sparkle feed key fails the pull request before the Swift build
  # has finished starting.
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the provenance check below asserts that the derivation baseline is an
      # ancestor of HEAD, and the default shallow clone does not contain the inherited history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derivation provenance
        run: script/upstream.sh history
      - name: Update feed isolation
        run: python3 script/test_update_feed_isolation.py
      - name: Appcast validator self-tests
        run: python3 script/test_validate_appcast.py
      - name: License inventory
        run: python3 script/license-inventory.py
      - name: Scene domain layering
        run: python3 script/test_scene_domain_layering.py

  # The Swift build and the unit tests. The toolchain is pinned by .swift-version and installed
  # with swiftly, the same way script/setup.sh resolves it locally, so CI and a developer machine
  # compile with the same compiler.
  #
  # macos-26, not macos-15: the inherited UI calls the Liquid Glass API `glassEffect` behind a
  # runtime `if #available(macOS 26.0, *)` check (Sources/AppBundle/ui/core/DesignTokens.swift).
  # A runtime check still needs the symbol at compile time, so the macOS 26 SDK is required — the
  # macos-15 image tops out at Xcode 16.4 and cannot build this repository at all.
  build-and-test:
    name: build-and-test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install swiftly
        run: brew install swiftly
      - name: Install the pinned Swift toolchain
        run: |
          swiftly init --skip-install --assume-yes --verbose
          swiftly install
      - name: Build
        run: make build VERSION=0.0.0
      - name: Test
        run: |
          set -euo pipefail
          source ./script/setup.sh
          swift test
      # The same suite again, compiled the way a release is compiled. HORO-1175 was a crash that
      # existed only under `-O`: the debug suite passed, CI was green, and the Release app died on
      # first launch. A suite that only ever runs unoptimized cannot catch that class of defect, and
      # the shipped artifact is the optimized one.
      - name: Test (release configuration)
        run: |
          set -euo pipefail
          source ./script/setup.sh
          swift test -c release
